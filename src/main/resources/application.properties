server.port=8080
spring.application.name=seo-sem-analyzer

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# H2 Database configuration (Persistent on disk)
spring.datasource.url=jdbc:h2:file:./data/analyzer_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at /h2-console for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.analyzer.seo=INFO
